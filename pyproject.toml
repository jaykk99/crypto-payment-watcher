[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-payment-watcher"
version = "1.0.0"
description = "Reusable BTC payment watcher: manual pay, mempool.space polling, 2 confirmations, 60-minute window, 1% tolerance, no custody."
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
api = ["fastapi"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
